<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Listing Stats</title>
<style>
:root{--bg:#f3f5f7;--surface:#fff;--ink:#14212e;--muted:#5a6876;--line:#dbe1e7;--accent:#1f5f7a;--wa:#1f8a4c}
@media (prefers-color-scheme:dark){:root{--bg:#0f161d;--surface:#17212b;--ink:#e7edf2;--muted:#9aa9b6;--line:#2a3744;--accent:#6cb6d4;--wa:#3ec27a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:32px 16px;display:grid;gap:20px}
h1{margin:0;font-size:1.6rem}
p{margin:0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.n{font-size:2.2rem;font-weight:700;font-variant-numeric:tabular-nums}
.tile:nth-child(3) .n{color:var(--wa)}
.l{font-size:.85rem;color:var(--muted)}
button{justify-self:start;background:var(--accent);color:var(--surface);border:0;border-radius:8px;padding:10px 16px;font:600 1rem system-ui,sans-serif;cursor:pointer}
a{color:var(--accent)}
@media (max-width:480px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <h1>Listing stats</h1>
  <p>Private page for the owner. Your own visits on this browser are no longer counted.</p>
  <div class="grid">
    <div class="tile"><div class="n" id="visitors">…</div><div class="l">Unique visitors</div></div>
    <div class="tile"><div class="n" id="views">…</div><div class="l">Page views</div></div>
    <div class="tile"><div class="n" id="whatsapp">…</div><div class="l">WhatsApp taps</div></div>
  </div>
  <button id="refresh" type="button">Refresh</button>
  <p id="upd"></p>
  <p><a href="./">Open the listing</a></p>
</main>
<script>
try{localStorage.setItem("g2_owner","1")}catch(e){}
function load(){
  ["visitors","views","whatsapp"].forEach(function(k){
    fetch("https://abacus.jasoncameron.dev/get/galleria2bhk-site/"+k,{cache:"no-store"})
      .then(function(r){return r.ok?r.json():{value:0}})
      .then(function(j){document.getElementById(k).textContent=(j.value||0).toLocaleString("en-IN")})
      .catch(function(){document.getElementById(k).textContent="–"});
  });
  document.getElementById("upd").textContent="Updated "+new Date().toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"});
}
document.getElementById("refresh").onclick=load;load();
</script>
</body>
</html>
